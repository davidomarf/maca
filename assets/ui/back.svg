<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48">
  <defs>
    <linearGradient id="mineral" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c4e5ee"/>
      <stop offset=".48" stop-color="#548ca8"/>
      <stop offset="1" stop-color="#122b43"/>
    </linearGradient>
    <clipPath id="arrow-shape">
      <path d="M8 24 30 5v10h27v18H30v10z"/>
    </clipPath>
    <filter id="rock-texture" x="-10%" y="-10%" width="120%" height="120%">
