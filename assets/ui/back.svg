  <rect width="64" height="48" fill="#e4f7ff" opacity=".28" filter="url(#rock-texture)" clip-path="url(#arrow-shape)"/>
  <path d="m12 23 17-14m4 9h21" fill="none" stroke="#e5f5f3" stroke-opacity=".72" stroke-width="2" stroke-linecap="round"/>
